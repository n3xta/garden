<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Animation Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
            background: #1a1a2e;
        }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        
        #controls {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            color: white;
            z-index: 1000;
            min-width: 300px;
        }
        
        #controls h2 {
            margin-bottom: 15px;
            color: #4CAF50;
        }
        
        .control-group {
            margin-bottom: 15px;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        
        .control-group input[type="range"] {
            width: 100%;
        }
        
        .control-group select {
            width: 100%;
            padding: 5px;
            border-radius: 5px;
        }
        
        .value-display {
            display: inline-block;
            margin-left: 10px;
            color: #4CAF50;
            font-weight: bold;
        }
        
        button {
            padding: 10px 20px;
            background: #4CAF50;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            margin-right: 10px;
            margin-top: 10px;
        }
        
        button:hover {
            background: #45a049;
        }
        
        #info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            color: white;
            font-size: 12px;
            z-index: 1000;
        }
        
        .status {
            color: #4CAF50;
        }
        
        .error {
            color: #f44336;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="controls">
        <h2>Plant Animation Test</h2>
        
        <div class="control-group">
            <label for="plantSelect">Select Plant Model:</label>
            <select id="plantSelect">
                <option value="1">Plant 1</option>
                <option value="2">Plant 2</option>
                <option value="3">Plant 3</option>
                <option value="4">Plant 4</option>
                <option value="5">Plant 5</option>
            </select>
        </div>
        
        <div class="control-group">
            <label for="animationTime">
                Animation Progress: 
                <span class="value-display" id="animTimeValue">0.00</span>
            </label>
            <input type="range" id="animationTime" min="0" max="1" step="0.01" value="0">
        </div>
        
        <div class="control-group">
            <label for="scaleX">
                Scale X: 
                <span class="value-display" id="scaleXValue">1.00</span>
            </label>
            <input type="range" id="scaleX" min="0.5" max="2" step="0.1" value="1">
        </div>
        
        <div class="control-group">
            <label for="scaleY">
                Scale Y: 
                <span class="value-display" id="scaleYValue">1.00</span>
            </label>
            <input type="range" id="scaleY" min="0.5" max="2" step="0.1" value="1">
        </div>
        
        <div class="control-group">
            <label for="scaleZ">
                Scale Z: 
                <span class="value-display" id="scaleZValue">1.00</span>
            </label>
            <input type="range" id="scaleZ" min="0.5" max="2" step="0.1" value="1">
        </div>
        
        <button id="playPause">Play Animation</button>
        <button id="resetBtn">Reset</button>
    </div>
    
    <div id="info">
        <div>Model Status: <span id="modelStatus" class="status">Loading...</span></div>
        <div>Animation Clips: <span id="animClips">0</span></div>
        <div>Skinned Meshes: <span id="skinnedMeshes">0</span></div>
        <div>Bones: <span id="bonesCount">0</span></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        // Scene setup
        let scene, camera, renderer, controls;
        let currentPlant = null;
        let animationMixer = null;
        let animationAction = null;
        let animationClip = null;
        let clock = new THREE.Clock();
        let isPlaying = false;
        
        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);
            
            // Camera
            camera = new THREE.PerspectiveCamera(
                50, 
                window.innerWidth / window.innerHeight, 
                0.1, 
                1000
            );
            camera.position.set(3, 2, 5);
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            
            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            
            const spotLight = new THREE.SpotLight(0xffffff, 1);
            spotLight.position.set(0, 5, 0);
            spotLight.angle = Math.PI / 4;
            spotLight.castShadow = true;
            scene.add(spotLight);
            
            // Ground plane
            const groundGeometry = new THREE.PlaneGeometry(10, 10);
            const groundMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x2a2a3e,
                roughness: 0.8
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.5;
            ground.receiveShadow = true;
            scene.add(ground);
            
            // Grid helper
            const gridHelper = new THREE.GridHelper(10, 10, 0x444466, 0x222233);
            gridHelper.position.y = -0.49;
            scene.add(gridHelper);
            
            // Axes helper
            const axesHelper = new THREE.AxesHelper(2);
            scene.add(axesHelper);
            
            // Load initial plant
            loadPlant(1);
            
            // Setup event listeners
            setupEventListeners();
            
            // Start animation loop
            animate();
            
            // Window resize
            window.addEventListener('resize', onWindowResize);
        }
        
        function loadPlant(plantNumber) {
            // Remove existing plant
            if (currentPlant) {
                scene.remove(currentPlant);
                if (animationMixer) {
                    animationMixer.stopAllAction();
                }
            }
            
            document.getElementById('modelStatus').textContent = 'Loading...';
            document.getElementById('modelStatus').className = 'status';
            
            const loader = new THREE.GLTFLoader();
            loader.load(
                `/3d/plants/${plantNumber}.glb`,
                (gltf) => {
                    currentPlant = gltf.scene;
                    scene.add(currentPlant);
                    
                    // Analyze the model
                    let skinnedMeshCount = 0;
                    let totalBones = 0;
                    
                    currentPlant.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                        }
                        
                        if (child.isSkinnedMesh) {
                            skinnedMeshCount++;
                            if (child.skeleton) {
                                totalBones += child.skeleton.bones.length;
                                // Ensure skeleton is properly bound
                                console.log('SkinnedMesh found:', child.name);
                                console.log('Skeleton:', child.skeleton);
                                console.log('Bones:', child.skeleton.bones.length);
                            }
                        }
                    });
                    
                    // Update info
                    document.getElementById('animClips').textContent = gltf.animations.length;
                    document.getElementById('skinnedMeshes').textContent = skinnedMeshCount;
                    document.getElementById('bonesCount').textContent = totalBones;
                    
                    // Setup animation if available
                    if (gltf.animations && gltf.animations.length > 0) {
                        animationMixer = new THREE.AnimationMixer(currentPlant);
                        animationClip = gltf.animations[0];
                        animationAction = animationMixer.clipAction(animationClip);
                        animationAction.paused = true;
                        animationAction.play();
                        
                        console.log('Animation clip duration:', animationClip.duration);
                        console.log('Animation tracks:', animationClip.tracks.length);
                        
                        document.getElementById('modelStatus').textContent = 'Loaded with animation';
                        document.getElementById('modelStatus').className = 'status';
                    } else {
                        animationMixer = null;
                        animationAction = null;
                        animationClip = null;
                        document.getElementById('modelStatus').textContent = 'Loaded (No animation)';
                        document.getElementById('modelStatus').className = 'status';
                    }
                    
                    // Reset controls
                    document.getElementById('animationTime').value = 0;
                    document.getElementById('animTimeValue').textContent = '0.00';
                    isPlaying = false;
                    document.getElementById('playPause').textContent = 'Play Animation';
                },
                (progress) => {
                    const percent = (progress.loaded / progress.total * 100).toFixed(0);
                    document.getElementById('modelStatus').textContent = `Loading... ${percent}%`;
                },
                (error) => {
                    console.error('Error loading plant:', error);
                    document.getElementById('modelStatus').textContent = 'Error loading model';
                    document.getElementById('modelStatus').className = 'error';
                }
            );
        }
        
        function setupEventListeners() {
            // Plant selection
            document.getElementById('plantSelect').addEventListener('change', (e) => {
                loadPlant(parseInt(e.target.value));
            });
            
            // Animation time slider
            document.getElementById('animationTime').addEventListener('input', (e) => {
                const progress = parseFloat(e.target.value);
                document.getElementById('animTimeValue').textContent = progress.toFixed(2);
                
                if (animationAction && animationClip) {
                    const time = progress * animationClip.duration;
                    animationAction.time = time;
                    if (animationMixer) {
                        animationMixer.update(0.001); // Small delta to force update
                    }
                }
            });
            
            // Scale controls
            document.getElementById('scaleX').addEventListener('input', (e) => {
                const value = parseFloat(e.target.value);
                document.getElementById('scaleXValue').textContent = value.toFixed(2);
                if (currentPlant) currentPlant.scale.x = value;
            });
            
            document.getElementById('scaleY').addEventListener('input', (e) => {
                const value = parseFloat(e.target.value);
                document.getElementById('scaleYValue').textContent = value.toFixed(2);
                if (currentPlant) currentPlant.scale.y = value;
            });
            
            document.getElementById('scaleZ').addEventListener('input', (e) => {
                const value = parseFloat(e.target.value);
                document.getElementById('scaleZValue').textContent = value.toFixed(2);
                if (currentPlant) currentPlant.scale.z = value;
            });
            
            // Play/Pause button
            document.getElementById('playPause').addEventListener('click', () => {
                if (!animationAction) return;
                
                isPlaying = !isPlaying;
                document.getElementById('playPause').textContent = isPlaying ? 'Pause Animation' : 'Play Animation';
            });
            
            // Reset button
            document.getElementById('resetBtn').addEventListener('click', () => {
                document.getElementById('animationTime').value = 0;
                document.getElementById('scaleX').value = 1;
                document.getElementById('scaleY').value = 1;
                document.getElementById('scaleZ').value = 1;
                
                document.getElementById('animTimeValue').textContent = '0.00';
                document.getElementById('scaleXValue').textContent = '1.00';
                document.getElementById('scaleYValue').textContent = '1.00';
                document.getElementById('scaleZValue').textContent = '1.00';
                
                if (currentPlant) {
                    currentPlant.scale.set(1, 1, 1);
                }
                
                if (animationAction) {
                    animationAction.time = 0;
                    if (animationMixer) {
                        animationMixer.update(0.001);
                    }
                }
                
                isPlaying = false;
                document.getElementById('playPause').textContent = 'Play Animation';
            });
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            
            // Update animation mixer if playing
            if (isPlaying && animationMixer && animationAction && animationClip) {
                animationMixer.update(delta);
                
                // Update slider to match animation time
                const progress = animationAction.time / animationClip.duration;
                document.getElementById('animationTime').value = progress;
                document.getElementById('animTimeValue').textContent = progress.toFixed(2);
                
                // Loop animation
                if (animationAction.time >= animationClip.duration) {
                    animationAction.time = 0;
                }
            }
            
            controls.update();
            renderer.render(scene, camera);
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // Initialize
        init();
    </script>
</body>
</html>
